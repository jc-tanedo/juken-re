name: Android test APK

on:
  push:
    branches: [android-17-support, feature/android-voice-mode, feature/vosk-recognition, feature/wanikani-modernization]
  workflow_dispatch:

permissions:
  contents: read

env:
  APK_ARTIFACT_NAME: ${{ github.ref_name == 'feature/wanikani-modernization' && 'juken-wanikani-modernization-test-apk' || github.ref_name == 'feature/vosk-recognition' && 'juken-vosk-test-apk' || github.ref_name == 'feature/android-voice-mode' && 'juken-voice-mode-test-apk' || 'juken-android-test-apk' }}

jobs:
  build:
    name: Build signed test APK
    runs-on: [self-hosted, linux, x64, android]
    timeout-minutes: 45
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      CI: '1'
      EXPO_OFFLINE: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Generate Android project
        run: yarn expo prebuild --platform android --no-install

      - name: Build test APK
        working-directory: android
        run: |
          ./gradlew :app:assembleRelease --no-daemon --console=plain \
            -PreactNativeArchitectures=arm64-v8a,x86_64 \
            -Pandroid.enableMinifyInReleaseBuilds=false

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Upload test APK
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_ARTIFACT_NAME }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  cleanup:
    name: Keep the newest test APK
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete older test APK artifacts
        uses: actions/github-script@v8
        env:
          UPLOADED_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
        with:
          script: |
            const repo = context.repo;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              ...repo,
              name: process.env.APK_ARTIFACT_NAME,
              per_page: 100,
            });
            const active = artifacts.filter(artifact =>
              !artifact.expired && artifact.name === process.env.APK_ARTIFACT_NAME
            );
            const uploaded = active.find(artifact =>
              String(artifact.id) === process.env.UPLOADED_ARTIFACT_ID
            );
            if (!uploaded) {
              core.info('This upload is no longer listed or is not visible yet. Skipping cleanup.');
              return;
            }

            active.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at) || b.id - a.id);
            const [latest, ...older] = active;
            core.info(`Keeping artifact ${latest.id}.`);
            for (const artifact of older) {
              try {
                await github.rest.actions.deleteArtifact({ ...repo, artifact_id: artifact.id });
                core.info(`Deleted artifact ${artifact.id}.`);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
