plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.jukenfold'
version = '1.0.0'

android {
  namespace 'expo.modules.jukenfold'
  defaultConfig {
    consumerProguardFiles 'consumer-rules.pro'
  }
}

dependencies {
  implementation 'androidx.window:window:1.3.0'
}
